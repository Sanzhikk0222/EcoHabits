<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoHabits</title>
<meta name="description" content="Күнде бір эко-тапсырма орында, XP жина, өз орманыңды өсір.">
<script>
  document.documentElement.classList.add('js');

  (function () {
    function show(msg) {
      var b = document.getElementById('boot');
      if (!b || b.getAttribute('data-err')) return;
      b.setAttribute('data-err', '1');
      b.textContent = 'Қате / Ошибка: ' + msg;
      b.style.cssText = 'display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center;font:16px sans-serif;color:#b91c1c';
    }
    window.addEventListener('error', function (e) { show(e.message || 'error'); });
    window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
  })();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style type="text/tailwindcss">
  @layer components {
    .btn { @apply inline-flex min-h-[44px] items-center justify-center gap-2 rounded-lg px-4 py-2 font-bold transition-colors duration-150 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-moss-700 disabled:cursor-not-allowed disabled:opacity-60; }
    .btn-primary { @apply bg-moss-700 text-white hover:bg-moss-800; }
    .btn-ghost { @apply border border-moss-200 bg-white text-ink hover:bg-moss-50; }
    .field { @apply block w-full min-h-[44px] rounded-lg border border-moss-200 bg-white px-3 py-2 text-ink placeholder:text-ink/50 focus:border-moss-700 focus:outline focus:outline-2 focus:outline-moss-700; }
    .card { @apply rounded-xl border border-moss-200 bg-white; }

<style>
  html { scroll-behavior: smooth; }
  #auth-view.hidden { display: none !important; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  .lang { display: inline-flex; border-radius: .6rem; border: 1px solid #bfd5c0; background: #fff; padding: 2px; }
  .lang-btn { min-height: 40px; min-width: 48px; border-radius: .45rem; font-weight: 700; font-size: .875rem; color: #17231c; transition: background-color .15s, color .15s; }
  .lang-btn:hover { background: #f1f6f1; }
  .lang-btn[aria-pressed="true"] { background: #256240; color: #fff; }
  .lang-btn:focus-visible { outline: 2px solid #256240; outline-offset: 2px; }

  .qtab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 52px; padding: .3rem .25rem; line-height: 1.2; border-radius: .5rem; font-weight: 700; color: #17231c; transition: background-color .2s, box-shadow .2s; }
  .qtab:hover { background: rgba(255,255,255,.55); }
  .qtab[aria-selected="true"] { background: #fff; box-shadow: 0 1px 3px rgba(19,53,36,.18); }
  .qtab:focus-visible { outline: 2px solid #256240; outline-offset: 2px; }

  .plant { line-height: 1; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; transition: height .6s cubic-bezier(.2,.8,.2,1), width .6s cubic-bezier(.2,.8,.2,1); }
  .plant.grow { animation: grow .9s cubic-bezier(.2,.8,.2,1), sway 6s ease-in-out .9s infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }
  @keyframes grow { from { transform: scale(.2); opacity: .2; } 60% { transform: scale(1.1); } to { transform: scale(1); opacity: 1; } }
  @keyframes xpfloat { from { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } to { opacity: 0; transform: translateY(-80px); } }
  .xp-float.run { animation: xpfloat 1.6s ease-out forwards; }
  .bar-fill { position: relative; overflow: hidden; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .bar-fill.shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.6) 50%, transparent 70%); transform: translateX(-100%); animation: shine 1.2s ease-out .7s; }
  @keyframes shine { to { transform: translateX(100%); } }

  .sky-dawn  { background: linear-gradient(#f9d9b6, #fbeede 70%); }
  .sky-day   { background: linear-gradient(#a9dcf3, #e9f6ee 72%); }
  .sky-eve   { background: linear-gradient(#f2a36b, #f8dcc0 70%); }
  .sky-night { background: linear-gradient(#0d1b2e, #2a4560 75%); }
  .cloud { position: absolute; height: 22px; border-radius: 999px; animation: drift 46s linear infinite alternate; }
  .cloud::before { content: ""; position: absolute; left: 18%; top: -12px; width: 40%; height: 26px; border-radius: 999px; background: inherit; }
  @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(60px); } }
  .sw { transform-box: fill-box; transform-origin: 50% 100%; animation: leafsway 5.5s ease-in-out infinite; }
  @keyframes leafsway { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
  .swing { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 4.2s ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
  .rays { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
  .bird { position: absolute; left: 0; animation: fly 26s linear infinite; }
  @keyframes fly { from { transform: translateX(-60px) translateY(0); } 50% { transform: translateX(40vw) translateY(-14px); } to { transform: translateX(100vw) translateY(6px); } }
  .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .45s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  .bfly { position: absolute; animation: flutter 16s ease-in-out infinite; }
  @keyframes flutter { 0%,100% { transform: translate(0,0); } 20% { transform: translate(70px,-30px); } 40% { transform: translate(130px,10px); } 60% { transform: translate(50px,-44px); } 80% { transform: translate(-20px,-12px); } }
  .bw { transform-box: view-box; transform-origin: 12px 10px; animation: flapw .28s ease-in-out infinite alternate; }
  @keyframes flapw { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
  .ff { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #f7f08a; box-shadow: 0 0 8px 3px rgba(247,240,138,.6); animation: twinkle 3s ease-in-out infinite; }

  .js [data-reveal] { opacity: 0; transform: translateY(18px); transition: opacity .6s ease-out var(--d, 0ms), transform .7s cubic-bezier(.2,.8,.2,1) var(--d, 0ms); }
  .js [data-reveal].in { opacity: 1; transform: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); }
  .lb-row { animation: rise .45s ease-out both; animation-delay: calc(var(--i, 0) * 35ms); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .draw-circle { stroke-dasharray: 76; stroke-dashoffset: 76; animation: draw .5s ease-out .05s forwards; }
  .draw-check { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .35s ease-out .45s forwards; }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(37,98,64,.45); } 100% { box-shadow: 0 0 0 10px rgba(37,98,64,0); } }
  .now { animation: pulse-ring 2s ease-out infinite; border-radius: .75rem; }

  .shutter { width: 76px; height: 76px; flex: none; border-radius: 50%; border: 4px solid #fff; background: transparent; display: grid; place-items: center; }
  .shutter::after { content: ""; width: 56px; height: 56px; border-radius: 50%; background: #fff; transition: transform .12s; }
  .shutter:active:not(:disabled)::after { transform: scale(.86); }
  .shutter:disabled { opacity: .4; }
  .shutter:focus-visible, .cam-btn:focus-visible { outline: 3px solid #f4c430; outline-offset: 3px; }
  .cam-btn { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; }
  .cam-pill { display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 .9rem; border-radius: 999px; background: rgba(0,0,0,.4); color: #fff; font-size: .875rem; font-weight: 700; }
  .cam-pill:focus-within { outline: 3px solid #f4c430; outline-offset: 3px; }
  .cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .cam-flash.run { animation: flash .35s ease-out; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .spinner { width: 18px; height: 18px; border: 3px solid #bfd5c0; border-top-color: #256240; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #app-header { transition: box-shadow .2s; }
  #app-header.scrolled { box-shadow: 0 2px 10px rgba(19,53,36,.1); }
  ::selection { background: #f4c430; color: #17231c; }

  @media (prefers-reduced-motion: reduce) {
    .plant, .plant.grow, .xp-float.run, .spinner, .cloud, .rise, .lb-row, .sw, .swing, .tw, .rays, .bird, .wing, .bfly, .bw, .ff, .now,
    .bar-fill.shine::after, .cam-flash.run { animation: none; }
    .draw-circle, .draw-check { animation: none; stroke-dashoffset: 0; }
    .js [data-reveal] { opacity: 1; transform: none; transition: none; }
    * { transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>

<body class="bg-moss-50 font-sans text-ink antialiased">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gLeaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2f8d4e"/><stop offset="1" stop-color="#86d68f"/></linearGradient>
    <linearGradient id="gLeafD" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1f6a3c"/><stop offset="1" stop-color="#4fae6a"/></linearGradient>
    <linearGradient id="gTrunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b3f27"/><stop offset=".55" stop-color="#8a6140"/><stop offset="1" stop-color="#5e4029"/></linearGradient>
    <radialGradient id="gCan" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#9be59a"/><stop offset=".55" stop-color="#3fa05c"/><stop offset="1" stop-color="#26763f"/></radialGradient>

<a href="#main" class="sr-only rounded bg-white px-3 py-2 focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50" data-i18n="skip">Мазмұнға өту</a>

<div id="config-warning" class="hidden min-h-screen place-items-center p-6">
  <div class="card max-w-lg p-6">
    <h1 class="text-xl font-bold" data-i18n="cfg.title">Supabase әлі қосылмаған</h1>
    <p class="mt-2 text-ink/80" data-i18n-html="cfg.body"></p>
  </div>
</div>

<div id="boot" class="grid min-h-screen place-items-center">
  <div class="flex items-center gap-3 text-ink/80"><span class="spinner" aria-hidden="true"></span> <span data-i18n="boot">Жүктелуде…</span></div>
</div>

<section id="auth-view" class="hidden min-h-screen lg:grid lg:grid-cols-2" data-i18n-aria="auth.aria" aria-label="Кіру және тіркелу">
  <div class="overflow-hidden bg-moss-900 p-8 text-white lg:p-14">
    <div class="rise flex items-center gap-2 text-xl font-bold"><span data-icon="leaf" data-class="h-7 w-7 text-sun-400"></span> EcoHabits</div>
    <h1 class="rise mt-8 max-w-md text-3xl font-bold leading-tight lg:text-4xl" style="--d:120ms; text-wrap: balance" data-i18n="auth.h1"></h1>
    <p class="rise mt-4 max-w-md text-white/80" style="--d:220ms" data-i18n="auth.p"></p>

    <div class="rise mt-8 max-w-md" style="--d:320ms">
      <div class="relative h-56 overflow-hidden rounded-2xl sky-day">
        <div class="absolute right-6 top-5 h-12 w-12 rounded-full" style="background:radial-gradient(circle,#fff6c2,#f7cf45 70%)" aria-hidden="true"></div>
        <div class="cloud" style="left:8%; top:22px; width:80px; background:rgba(255,255,255,.85)" aria-hidden="true"></div>
        <div class="absolute inset-x-0 bottom-0 h-8" style="background:linear-gradient(#8a6a47,#4d3826)" aria-hidden="true"></div>
        <div class="absolute inset-x-0 bottom-5 flex justify-center"><div id="hero-plant" class="plant h-48 w-48" role="img" aria-hidden="true"></div></div>
      </div>
      <p id="hero-cap" class="mt-3 text-sm text-white/80" aria-live="off"></p>
    </div>

    <ol id="auth-ladder" class="mt-8 hidden max-w-md gap-2 lg:grid"></ol>
  </div>

  <div class="relative flex items-center justify-center p-6 lg:p-14">
    <div class="absolute right-4 top-4"><div class="lang" role="group" data-i18n-aria="lang.label" aria-label="Тіл">
      <button type="button" class="lang-btn" data-lang="kk" aria-pressed="true">ҚАЗ</button>
      <button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">РУС</button>
    </div></div>

    <div class="rise w-full max-w-sm pt-10 lg:pt-0" style="--d:200ms">
      <div role="tablist" data-i18n-aria="auth.tabs.aria" aria-label="Кіру немесе тіркелу" class="grid grid-cols-2 rounded-lg bg-moss-100 p-1">
        <button id="tab-login" role="tab" aria-selected="true" class="min-h-[44px] rounded-md font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-moss-700" data-i18n="auth.login">Кіру</button>
        <button id="tab-signup" role="tab" aria-selected="false" class="min-h-[44px] rounded-md font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-moss-700" data-i18n="auth.signup">Тіркелу</button>
      </div>

      <h2 id="auth-title" class="mt-6 text-2xl font-bold"></h2>

      <button id="btn-google" type="button" class="btn btn-ghost mt-5 w-full">
        <svg viewBox="0 0 48 48" class="h-5 w-5" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span data-i18n="auth.google"></span>
      </button>

      <div class="my-5 flex items-center gap-3 text-sm text-ink/70" aria-hidden="true"><span class="h-px flex-1 bg-moss-200"></span><span data-i18n="auth.or">немесе</span><span class="h-px flex-1 bg-moss-200"></span></div>

      <form id="auth-form" novalidate class="space-y-4">
        <div>
          <label for="f-email" class="mb-1 block font-bold" data-i18n="f.email">Email</label>
          <input id="f-email" class="field" type="email" autocomplete="email" required placeholder="aidar@mail.kz">
        </div>
        <div id="wrap-username" class="hidden">
          <label for="f-username" class="mb-1 block font-bold" data-i18n="f.username"></label>
          <input id="f-username" class="field" type="text" autocomplete="username" maxlength="20" placeholder="eco_aidar" aria-describedby="username-hint">
          <p id="username-hint" class="mt-1 text-sm text-ink/70" data-i18n="f.username.hint"></p>
        </div>
        <div>
          <label for="f-password" class="mb-1 block font-bold" data-i18n="f.password"></label>
          <input id="f-password" class="field" type="password" autocomplete="current-password" required minlength="8" aria-describedby="password-hint">
          <p id="password-hint" class="mt-1 hidden text-sm text-ink/70" data-i18n="f.password.hint"></p>
        </div>
        <p id="auth-msg" class="min-h-[1.25rem] text-sm" role="alert"></p>
        <button id="auth-submit" type="submit" class="btn btn-primary w-full"></button>
      </form>
    </div>
  </div>
</section>

<div id="app-view" class="hidden">
  <header id="app-header" class="sticky top-0 z-30 border-b border-moss-200 bg-white">

  <main id="main" class="mx-auto max-w-6xl px-4 pb-28 pt-6 md:pb-10">

    <section id="route-home" class="hidden space-y-6">
      <h1 id="home-title" tabindex="-1" data-reveal class="text-2xl font-bold outline-none"></h1>
      <div class="grid gap-6 lg:grid-cols-[1.4fr_1fr]">
        <div class="card overflow-hidden" data-reveal>
          <div id="plant-scene" class="relative h-80 overflow-hidden sm:h-96">
            <div id="scene-sky" class="absolute inset-0"></div>
            <div id="scene-objs" aria-hidden="true"></div>
            <div id="scene-land" aria-hidden="true"></div>
            <div id="scene-fx" aria-hidden="true"></div>
            <div class="absolute inset-x-0 flex justify-center" style="bottom:36px">
              <div id="plant-art" class="plant" role="img"></div>
            </div>
            <div id="scene-front" aria-hidden="true"></div>
            <div id="scene-tint" class="pointer-events-none absolute inset-0" aria-hidden="true"></div>
            <div id="xp-float" class="xp-float pointer-events-none absolute inset-x-0 bottom-44 text-center text-2xl font-bold text-moss-900 opacity-0" aria-hidden="true">+50 XP</div>
          </div>
          <div class="space-y-4 p-5">
            <div class="flex flex-wrap items-baseline justify-between gap-2">
              <h2 id="plant-name" class="text-xl font-bold"></h2>
              <p class="font-bold text-moss-700"><span id="plant-xp">0</span> XP</p>
            </div>
            <p id="plant-desc" class="text-ink/80"></p>
            <div>
              <div id="xp-bar" class="h-3 overflow-hidden rounded-full bg-moss-100" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="xp.aria">
                <div id="xp-fill" class="bar-fill h-full rounded-full" style="width:0%; background:linear-gradient(90deg,#2e7a4a,#6bbf6f)"></div>
              </div>

<script type="module">

const CONFIG = {
  TZ: 'Asia/Almaty',
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: ''
};

async function loadConfig() {
  try {
    const m = await import('./config.js');
    Object.assign(CONFIG, m.CONFIG);
  } catch (e) { console.warn('config.js табылмады', e); }

  CONFIG.SUPABASE_URL = String(CONFIG.SUPABASE_URL || '').trim().replace(/\/(rest|auth)\/v1\/?$/, '').replace(/\/+$/, '');
  CONFIG.SUPABASE_ANON_KEY = String(CONFIG.SUPABASE_ANON_KEY || '').trim();
}

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('ru-RU');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const dateFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: CONFIG.TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const dateKey = (d = new Date()) => dateFmt.format(d);

const hourFmt = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.TZ, hour: '2-digit', hour12: false });

function animateNumber(el, from, to, ms = 900) {
  const id = el._an = (el._an || 0) + 1;
  if (reduceMotion() || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const tick = (t) => {
    if (el._an !== id) return;
    const k = Math.min(1, (t - t0) / ms);
    el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

const I18n = {
  lang: 'kk',

  init() {
    let l = null;
    try { l = localStorage.getItem('eco-lang'); } catch {  }
    if (l !== 'kk' && l !== 'ru') l = (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'kk';
    this.lang = l;
    document.documentElement.lang = l;
  },

  set(l) {
    if (l === this.lang) return;
    this.lang = l;
    try { localStorage.setItem('eco-lang', l); } catch {  }
    document.documentElement.lang = l;
    App.relang();
  },

  apply(root = document) {
    $$('[data-i18n]', root).forEach(el => { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-html]', root).forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    $$('[data-i18n-aria]', root).forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === this.lang)));
    const meta = $('meta[name="description"]'); if (meta) meta.setAttribute('content', t('meta.desc'));
  }
};

const t = (key, vars) => {
  let s = (DICT[I18n.lang] && DICT[I18n.lang][key]);
  if (s == null) s = DICT.kk[key];
  if (s == null) s = key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m)) : s;
};

function daysWord(n) {
  if (I18n.lang !== 'ru') return 'күн';
  const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? 'дней' : b === 1 ? 'день' : b >= 2 && b <= 4 ? 'дня' : 'дней';
}

function greeting() {
  const h = Number(hourFmt.format(new Date())) % 24;
  return t(h < 5 ? 'greet.night' : h < 12 ? 'greet.morning' : h < 18 ? 'greet.day' : 'greet.evening');
}

const Reveal = {
  io: null,
  init() {
    if (reduceMotion() || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); this.io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
  },

  replay(section) {
    const els = $$('[data-reveal]', section);
    els.forEach((el, i) => {
      el.style.setProperty('--d', Math.min(i, 8) * 70 + 'ms');
      if (!this.io) { el.classList.add('in'); return; }
      el.classList.remove('in');
      this.io.unobserve(el);
    });
    void section.offsetWidth;
    if (this.io) els.forEach(el => this.io.observe(el));
  }
};

function leafBurst(host, n = 14, origin = { left: '50%', bottom: '8rem' }) {
  if (reduceMotion() || !host.animate) return;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    el.className = 'pointer-events-none absolute z-10 ' + (i % 4 === 0 ? 'text-sun-500' : 'text-moss-600');
    Object.assign(el.style, origin);
    el.innerHTML = icon('leaf', 'h-5 w-5');
    host.appendChild(el);
    const ang = (-90 + (Math.random() - 0.5) * 150) * Math.PI / 180;
    const dist = 90 + Math.random() * 120;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = (Math.random() - 0.5) * 420;
    const a = el.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(.6)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(1)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${dx * 1.1}px,${dy + 70}px) rotate(${rot * 1.3}deg) scale(.9)`, opacity: 0 }
    ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)' });
    a.onfinish = () => el.remove();
  }
}

const rng = (seed) => () => {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const r1 = (v) => Math.round(v * 10) / 10;

const STAGES = [
  { min: 0,    max: 300 },
  { min: 301,  max: 800 },
  { min: 801,  max: 2000 },
  { min: 2001, max: 4500 },
  { min: 4501, max: 8000 },
  { min: 8001, max: Infinity }
];
const stageName = (i) => t(`stage.${i}.name`);
const rangeText = (i) => { const s = STAGES[i]; return (s.max === Infinity ? fmt(s.min) + '+' : fmt(s.min) + '–' + fmt(s.max)) + ' XP'; };

const Plant = {
  HEIGHTS: [210, 225, 220, 235, 252, 262],

  index(xp) { return STAGES.findIndex(s => xp <= s.max); },

  mini(i, size = 'h-9 w-9') { return `<span class="block ${size} shrink-0">${Art.svg(i, true)}</span>`; },

  buildLadders() {
    const cur = state.profile ? this.index(state.profile.xp) : -1;
    $('#plant-ladder').innerHTML = STAGES.map((s, i) =>
      `<li data-step="${i}" class="flex flex-col items-center gap-1 rounded-xl p-1 ${i <= cur ? '' : 'opacity-40 grayscale'} ${i === cur ? 'now bg-moss-50' : ''}" title="${esc(stageName(i))}: ${fmt(s.min)}+ XP">
         ${this.mini(i, 'h-11 w-11')}
         <span class="text-xs text-ink/80">${fmt(s.min)}</span>
       </li>`).join('');
    $('#auth-ladder').innerHTML = STAGES.map((s, i) =>
      `<li class="rise flex items-center gap-3 text-white/90" style="--d:${420 + i * 70}ms">
         ${this.mini(i, 'h-10 w-10')}
         <span class="font-bold">${esc(stageName(i))}</span>
         <span class="ml-auto text-sm text-white/70">${rangeText(i)}</span>
       </li>`).join('');
  },

  render(xp) {
    const i = this.index(xp);
    const el = $('#plant-art');
    if (el.dataset.stage !== String(i)) { el.innerHTML = Art.svg(i); el.dataset.stage = String(i); }
    el.style.height = this.HEIGHTS[i] + 'px';
    el.style.width = this.HEIGHTS[i] + 'px';
    el.setAttribute('aria-label', stageName(i));
    Scene.fx(i);

    $('#plant-name').textContent = stageName(i);
    $('#plant-desc').textContent = t(`stage.${i}.desc`);

    const s = STAGES[i];
    let pct = 100, note;
    if (s.max === Infinity) {
      note = t('plant.max');
    } else {
      pct = Math.min(100, ((xp - s.min) / (s.max - s.min + 1)) * 100);
      note = t('plant.next', { xp: fmt(s.max + 1 - xp), name: stageName(i + 1) });
    }
    $('#xp-fill').dataset.pct = String(pct);
    $('#xp-fill').style.width = pct + '%';
    $('#xp-bar').setAttribute('aria-valuenow', String(Math.round(pct)));
    $('#xp-next').textContent = note;
    this.buildLadders();
  },

  popGrow() {
    const el = $('#plant-art');
    if (reduceMotion()) return;
    el.classList.remove('grow'); void el.offsetWidth; el.classList.add('grow');
  },

  floatXp(amount) {
    const f = $('#xp-float');
    f.textContent = `+${amount} XP`;
    f.classList.remove('run'); void f.offsetWidth; f.classList.add('run');
  }
};

const effectiveStreak = (p) => {
  const yesterday = dateKey(new Date(Date.now() - 864e5));
  return p && p.last_active_date && p.last_active_date >= yesterday ? p.streak : 0;
};

const Periods = {
  week(k = dateKey()) {
    const d = new Date(k + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    return d.toISOString().slice(0, 10);
  },
  month(k = dateKey()) { return k.slice(0, 8) + '01'; },
  start(period, k = dateKey()) { return period === 'day' ? k : period === 'week' ? this.week(k) : this.month(k); },

  daysLeft(period, k = dateKey()) {
    const d = new Date(k + 'T00:00:00Z');
    if (period === 'week') return 7 - ((d.getUTCDay() + 6) % 7);
    const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    return last - d.getUTCDate() + 1;
  }
};

const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

const Auth = {
  mode: 'login',
  checkTimer: null,

  setMode(mode) {
    this.mode = mode;
    const signup = mode === 'signup';
    $('#tab-login').setAttribute('aria-selected', String(!signup));
    $('#tab-signup').setAttribute('aria-selected', String(signup));
    $('#tab-login').classList.toggle('bg-white', !signup);
    $('#tab-signup').classList.toggle('bg-white', signup);
    $('#wrap-username').classList.toggle('hidden', !signup);
    $('#password-hint').classList.toggle('hidden', !signup);
    $('#f-password').autocomplete = signup ? 'new-password' : 'current-password';
    $('#auth-title').textContent = t(signup ? 'auth.title.signup' : 'auth.title.login');
    $('#auth-submit').textContent = t(signup ? 'auth.submit.signup' : 'auth.submit.login');
    this.msg('');
  },

  msg(text, kind = 'error') {
    const el = $('#auth-msg');
    el.textContent = text;
    el.className = 'min-h-[1.25rem] text-sm ' + (kind === 'ok' ? 'font-bold text-moss-800' : 'font-bold text-red-700');
  },

  async usernameAvailable(u) {
    const { data, error } = await sb.rpc('username_available', { p: u });
    if (error) throw error;
    return data === true;
  },

  async validateUsername(raw) {
    const u = raw.trim().toLowerCase();
    if (!USERNAME_RE.test(u)) return { ok: false, text: t('f.username.hint') };
    try {
      return (await this.usernameAvailable(u))
        ? { ok: true, text: t('username.free'), u }
        : { ok: false, text: t('username.taken') };
    } catch { return { ok: false, text: t('username.checkFail') }; }
  },

  watchUsername(input, hint) {
    const base = hint.className.replace(/\s*(font-bold|text-red-700|text-moss-800|text-ink\/70)/g, '');
    input.addEventListener('input', () => {
      clearTimeout(this.checkTimer);
      if (!input.value.trim()) { hint.textContent = t('f.username.hint'); hint.className = base + ' text-ink/70'; return; }
      this.checkTimer = setTimeout(async () => {
        const r = await this.validateUsername(input.value);
        hint.textContent = r.text;
        hint.className = base + (r.ok ? ' text-moss-800 font-bold' : ' text-red-700 font-bold');
      }, 400);
    });
  },

  errorText(err) {
    if (err && err.status === 429) return t('err.rate');
    const m = (err && err.message || '').toLowerCase();
    if (m.includes('email not confirmed')) return t('err.unconfirmed');
    return t(this.mode === 'login' ? 'err.login' : 'err.signup');
  },

  async submit() {
    const email = $('#f-email').value.trim();
    const password = $('#f-password').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return this.msg(t('err.email'));
    if (this.mode === 'signup' && password.length < 8) return this.msg(t('err.pass8'));
    if (!password) return this.msg(t('err.passEmpty'));

    const btn = $('#auth-submit');
    btn.disabled = true; this.msg('');
    try {

      await Scan.step(t(live ? 'scan.live' : 'scan.meta'), async () => { if (!live) await AntiCheat.checkOrigin(file, quest.period); });
      await Scan.step(t('scan.print'), async () => { ctx.fp = await AntiCheat.fingerprint(file, ctx.bmp); });

      await Scan.step(t('scan.model'), async (setLabel) => {
        Vision.listen((pct) => setLabel(t('scan.modelPct', { pct })));
        try { ctx.clf = await Vision.load(); } finally { Vision.listen(null); }
      }, 300);

      await Scan.step(t('scan.content', { x: t(`q.${key}.seen`) }), async () => {
        const v = await Vision.judge(ctx.clf, file, quest);
        if (!v.ok) throw new Reject('mismatch', t('scan.mismatch', { seen: v.seen, need: t(`q.${key}.need`) }));
      });

      await Scan.step(t('scan.dupes'), async () => { ctx.profile = await this.claim(key, ctx.fp); });

      state.done.add(key);
      Scan.finish(true, t('scan.ok', { xp: quest.xp }));
      Profile.apply(ctx.profile, quest.xp);
      this.render(true);
    } catch (e) {
      let msg, detail = '';
      if (e instanceof Reject) {
        if (e.kind === 'fake') { msg = t('scan.fake'); if (e.why) detail = t('scan.why.' + e.why); }
        else msg = e.message;
      } else { console.error(e); msg = t('scan.unexpected'); }
      Scan.finish(false, msg, detail);
    } finally {
      if (ctx.bmp && ctx.bmp.close) ctx.bmp.close();
      state.busy = false;
    }
  }
};

const Exif = {
  async read(file) {
    const buf = await file.slice(0, 262144).arrayBuffer();
    const v = new DataView(buf);
    if (v.byteLength < 12 || v.getUint16(0) !== 0xFFD8) return null;
    let p = 2;
    while (p + 4 < v.byteLength) {
      if (v.getUint8(p) !== 0xFF) return null;
      const marker = v.getUint8(p + 1);
      if (marker === 0xDA || marker === 0xD9) return null;
      const len = v.getUint16(p + 2);
      if (marker === 0xE1 && p + 10 < v.byteLength && v.getUint32(p + 4) === 0x45786966 && v.getUint16(p + 8) === 0) {
        return this.parse(v, p + 10);
      }
      p += 2 + len;
    }
    return null;
  },

  parse(v, base) {
    const head = v.getUint16(base);
    const le = head === 0x4949;
    if (!le && head !== 0x4D4D) return null;
    const room = v.byteLength - base;
    const u16 = (o) => v.getUint16(base + o, le);
    const u32 = (o) => v.getUint32(base + o, le);
    if (u16(2) !== 42) return null;

    const text = (o, n) => {
      let out = '';
      for (let i = 0; i < n && o + i < room; i++) {
        const c = v.getUint8(base + o + i);
        if (!c) break;
        out += String.fromCharCode(c);
      }
      return out.trim();
    };

    const ifd = (off, wanted) => {
      const out = {};
      if (off < 8 || off + 2 > room) return out;
      const n = u16(off);
      for (let i = 0; i < n; i++) {
        const e = off + 2 + i * 12;
        if (e + 12 > room) break;
        const tag = u16(e);
        if (!wanted.includes(tag)) continue;
        const type = u16(e + 2), count = u32(e + 4);
        if (type === 2) out[tag] = text(count > 4 ? u32(e + 8) : e + 8, count);
        else if (type === 4) out[tag] = u32(e + 8);
      }
      return out;
    };

    const main = ifd(u32(4), [0x010F, 0x0110, 0x0131, 0x0132, 0x8769]);
    const sub = main[0x8769] ? ifd(main[0x8769], [0x9003, 0x9004]) : {};
    return {
      make: main[0x010F] || '',
      model: main[0x0110] || '',
      software: main[0x0131] || '',
      taken: this.date(sub[0x9003] || sub[0x9004] || main[0x0132] || '')
    };
  },

  date(s) {
    const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(s);
    if (!m || Number(m[1]) < 1995) return 0;
    const ms = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
    return Number.isFinite(ms) ? ms : 0;
  }
};

const AntiCheat = {
  MAX_BYTES: 12 * 1024 * 1024,
  MIN_SIDE: 300,
  MAX_AGE: { day: 36 * 3600e3, week: 8 * 864e5, month: 32 * 864e5 },
  MAX_AHEAD: 15 * 3600e3,
  SUSPICIOUS_NAME: /(google|stock|shutterstock|unsplash|pexels|pixabay|pinterest|freepik|istock|getty|depositphotos|wallpaper|download|screenshot|screen[ _-]?shot|скачан|скриншот)/i,
  EDITORS: /(photoshop|gimp|canva|picsart|pixlr|paint\.net)/i,

  async validateFormat(file) {
    if (!file.type.startsWith('image/')) throw new Reject('tech', t('err.notImage'));
    if (file.size > this.MAX_BYTES) throw new Reject('tech', t('err.tooBig'));
    let bmp;
    try { bmp = await createImageBitmap(file); }
    catch { throw new Reject('tech', t('err.unreadable')); }
    if (Math.min(bmp.width, bmp.height) < this.MIN_SIDE) { bmp.close(); throw new Reject('fake', null, 'small'); }
    return bmp;
  },

  async checkOrigin(file, period) {
    if (this.SUSPICIOUS_NAME.test(file.name)) throw new Reject('fake', null, 'name');
    let ex = null;
    try { ex = await Exif.read(file); } catch { ex = null; }
    if (!ex || (!ex.make && !ex.model)) throw new Reject('fake', null, 'noExif');
    if (this.EDITORS.test(ex.software)) throw new Reject('fake', null, 'edited');
    if (!ex.taken) throw new Reject('fake', null, 'noDate');
    const age = Date.now() - ex.taken;
    if (age > this.MAX_AGE[period]) throw new Reject('fake', null, 'old');
    if (age < -this.MAX_AHEAD) throw new Reject('fake', null, 'future');
  },

  async fingerprint(file, bmp) {
    if (!(window.crypto && crypto.subtle)) throw new Reject('tech', t('err.https'));
    const buf = await file.arrayBuffer();
    const digest = await crypto.subtle.digest('SHA-256', buf);
    const sha = [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');

    const c = document.createElement('canvas'); c.width = 9; c.height = 8;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0, 9, 8);
    const px = ctx.getImageData(0, 0, 9, 8).data;
    const gray = (i) => 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    let dhash = '';
    for (let y = 0; y < 8; y++)
      for (let x = 0; x < 8; x++)
        dhash += gray((y * 9 + x) * 4) > gray((y * 9 + x + 1) * 4) ? '1' : '0';
    return { sha, dhash };
  }
};

const SCORING = {
  MIN_SCORE: 0.35,

  groups(questKey) {
    const me = QUESTS.find(q => q.key === questKey);
    const sibs = QUESTS.filter(q => q.period === me.period).map(q => ({ key: q.key, seenKey: `q.${q.key}.seen`, prompts: q.prompts }));
    return [...sibs, ...OTHER_GROUPS.map(g => ({ key: g.key, seenKey: `seen.${g.key}`, prompts: g.prompts }))];
  },

  judge(out, questKey) {
    const groups = this.groups(questKey);
    const owner = new Map();
    groups.forEach(g => g.prompts.forEach(p => owner.set(p, g.key)));
    const sums = Object.fromEntries(groups.map(g => [g.key, 0]));
    for (const o of out) {
      let k = owner.get(o.label);
      if (!k) for (const [p, gk] of owner) if (o.label.includes(p)) { k = gk; break; }
      if (k) sums[k] += o.score;
    }
    const ranked = Object.entries(sums).sort((a, b) => b[1] - a[1]);
    const [topKey, topScore] = ranked[0];
    const g = groups.find(x => x.key === topKey);
    return {
      ok: topKey === questKey && topScore >= this.MIN_SCORE,
      top: topKey, topScore, seen: g ? t(g.seenKey) : '',
      table: ranked.map(([k, s]) => ({ топ: k, ұпай: Math.round(s * 1000) / 1000 }))
    };
  }
};

const Vision = {
  VERSION: '2.17.2',
  MODEL: 'Xenova/clip-vit-base-patch32',
  promise: null,
  files: {},
  listener: null,

  listen(fn) { this.listener = fn; },

  load() {
    if (this.promise) return this.promise;
    this.promise = (async () => {
      let tf;
      try { tf = await import(`https://cdn.jsdelivr.net/npm/@xenova/transformers@${this.VERSION}`); }
      catch { throw new Reject('tech', t('err.aiLib')); }
      tf.env.allowLocalModels = false;
      try {
        return await tf.pipeline('zero-shot-image-classification', this.MODEL, {
          progress_callback: (p) => this.onProgress(p)
        });
      } catch (e) {
        console.error('CLIP load', e);
        throw new Reject('tech', t('err.aiModel'));
      }
    })().catch(e => { this.promise = null; throw e; });
    return this.promise;
  },

  onProgress(p) {
    if (p.status !== 'progress' || !p.total) return;
    this.files[p.file] = { l: p.loaded, t: p.total };
    const v = Object.values(this.files);
    const pct = Math.round(v.reduce((a, x) => a + x.l, 0) / v.reduce((a, x) => a + x.t, 0) * 100);
    if (this.listener) this.listener(pct);
  },

  warm() {
    const c = navigator.connection;
    if (c && (c.saveData || c.type === 'cellular')) return;
    this.load().catch(() => {});
  },

  async judge(clf, file, quest) {
    const groups = SCORING.groups(quest.key);
    const labels = groups.flatMap(g => g.prompts);
    const url = URL.createObjectURL(file);
    let out;
    try { out = await clf(url, labels, { hypothesis_template: '{}' }); }
    catch (e) { console.error('CLIP run', e); throw new Reject('tech', t('err.aiRun')); }
    finally { URL.revokeObjectURL(url); }
    const v = SCORING.judge(out, quest.key);
    console.log(`AI Agent: «${quest.key}» → ${v.ok ? 'OK' : 'REJECT'}`);
    console.table(v.table);
    return v;
  }
};

const Scan = {
  opener: null,

  open() {
    this.opener = document.activeElement;
    $('#scan-steps').innerHTML = '';
    const r = $('#scan-result'); r.className = 'mt-5 hidden rounded-lg p-3 font-bold'; r.innerHTML = '';
    $('#scan-close').classList.add('hidden');
    $('#scan-go').classList.add('hidden');
    const m = $('#scan-modal'); m.classList.remove('hidden'); m.classList.add('grid');
    $('#scan-box').focus();
  },

  async step(label, fn, minMs = 650) {
    const li = document.createElement('li');
    li.className = 'rise flex items-center gap-3';
    li.innerHTML = `<span class="spinner shrink-0" aria-hidden="true"></span><span></span>`;
    const text = li.lastElementChild;
    text.textContent = label;
    $('#scan-steps').appendChild(li);
    let failure = null;
    await Promise.all([fn((s) => { text.textContent = s; }).catch(e => { failure = e; }), sleep(minMs)]);
    const mark = li.firstElementChild;
    if (failure) {
      mark.outerHTML = `<span class="shrink-0 font-bold text-red-700" aria-hidden="true">✕</span>`;
      throw failure;
    }
    mark.outerHTML = `<span class="shrink-0 text-moss-700">${icon('check', 'h-5 w-5')}</span>`;
  },

  finish(ok, text, detail = '') {
    const r = $('#scan-result');
    r.className = 'mt-5 flex items-start gap-3 rounded-lg p-3 font-bold ' + (ok ? 'bg-moss-100 text-moss-900' : 'bg-red-50 text-red-800');
    r.innerHTML = '';
    if (ok) {
      r.insertAdjacentHTML('beforeend', `<svg class="h-7 w-7 shrink-0 text-moss-700" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="draw-circle" cx="14" cy="14" r="12"/><path class="draw-check" d="m8.5 14.5 4 4 7-8"/></svg>`);
    }
    const box = document.createElement('div');
    const span = document.createElement('span');
    span.textContent = text;
    box.appendChild(span);
    if (detail) {
      const d = document.createElement('p');
      d.className = 'mt-1 text-sm font-normal';
      d.textContent = detail;
      box.appendChild(d);
    }
    r.appendChild(box);
    $('#scan-go').classList.toggle('hidden', !ok);
    const b = $('#scan-close'); b.classList.remove('hidden');
    (ok ? $('#scan-go') : b).focus();
    if (ok) leafBurst($('#scan-box'), 18, { left: '50%', top: '38%' });
  },

  close() {
    const m = $('#scan-modal'); m.classList.add('hidden'); m.classList.remove('grid');
    if (this.opener && this.opener.focus) this.opener.focus();
  }
};

const Camera = {
  stream: null,
  facing: 'environment',
  key: null,
  opener: null,

  supported() {
    return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  },

  async open(key) {
    if (state.busy) return;
    this.key = key;
    this.opener = document.activeElement;
    const m = $('#cam-modal');
    m.classList.remove('hidden');
    m.classList.add('block');
    document.body.style.overflow = 'hidden';
    $('#cam-hint').textContent = t('quests.need', { x: t(`q.${key}.need`) });
    this.msg('');
    $('#cam-shutter').focus();
    await this.start();
  },

  async start() {
    this.stop();
    const video = $('#cam-video');
    if (!this.supported()) return this.fail('cam.unsupported');
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: this.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
    } catch (e) {
      return this.fail(e && e.name === 'NotAllowedError' ? 'cam.denied' : 'cam.none');
    }
    video.srcObject = this.stream;
    try { await video.play(); } catch {  }
    this.msg('');
    $('#cam-shutter').disabled = false;
  },

  fail(key) {
    this.msg(t(key));
    $('#cam-shutter').disabled = true;
  },

  msg(text) {
    const el = $('#cam-msg');
    el.textContent = text;
    el.classList.toggle('hidden', !text);
  },

  stop() {
    if (this.stream) this.stream.getTracks().forEach(tr => tr.stop());
    this.stream = null;
    $('#cam-video').srcObject = null;
  },

  close() {
    this.stop();
    const m = $('#cam-modal');
    m.classList.add('hidden');
    m.classList.remove('block');
    document.body.style.overflow = '';
    if (this.opener && this.opener.focus) this.opener.focus();
  },

  flip() {
    this.facing = this.facing === 'environment' ? 'user' : 'environment';
    this.start();
  },

  async shoot() {
    const video = $('#cam-video');
    if (!this.stream || !video.videoWidth) return;
    const k = Math.min(1, 1600 / Math.max(video.videoWidth, video.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(video.videoWidth * k);
    c.height = Math.round(video.videoHeight * k);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    const flash = $('#cam-flash');
    flash.classList.remove('run'); void flash.offsetWidth; flash.classList.add('run');
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    if (!blob) return;
    const key = this.key;
    await sleep(reduceMotion() ? 0 : 160);
    this.close();
    Quests.submit(key, new File([blob], `camera-${Date.now()}.jpg`, { type: 'image/jpeg' }), true);
  },

  pickFile(file) {
    if (!file) return;
    const key = this.key;
    this.close();
    Quests.submit(key, file, false);
  }
};

const Leaderboard = {
  async load() {
    const body = $('#lb-body'), foot = $('#lb-foot'), podium = $('#lb-podium');
    body.innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-ink/80">${esc(t('lb.loading'))}</td></tr>`;
    foot.innerHTML = ''; podium.innerHTML = '';

    const { data, error } = await sb.from('profiles')
      .select('id,username,xp,streak,last_active_date')
      .not('username', 'is', null)
      .order('xp', { ascending: false }).order('username')
      .limit(50);

    if (error) { body.innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-red-700">${esc(t('lb.error'))}</td></tr>`; return; }
    if (!data.length) { body.innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-ink/80">${esc(t('lb.empty'))}</td></tr>`; return; }

    const order = ['sm:order-2', 'sm:order-1', 'sm:order-3'];
    podium.innerHTML = data.slice(0, 3).map((p, i) => {
      const me = p.id === state.uid;
      return `<li class="lb-row flex flex-col items-center rounded-xl border p-4 text-center ${order[i]} ${i === 0 ? 'border-sun-400 bg-sun-100 sm:pb-8' : 'border-moss-200 bg-white'} ${me ? 'ring-2 ring-moss-700' : ''}" style="--i:${i}">
        <span class="text-sm font-bold text-ink/70">#${i + 1}</span>
        ${Plant.mini(Plant.index(p.xp), 'h-20 w-20')}
        <span class="mt-1 max-w-full truncate font-bold">@${esc(p.username)}</span>
        <span class="text-moss-700 font-bold"><span data-count="${p.xp}">${fmt(p.xp)}</span> XP</span>
      </li>`;
    }).join('');

    const row = (p, rank, i) => {
      const me = p.id === state.uid;
      const idx = Plant.index(p.xp);
      return `<tr class="lb-row border-t border-moss-100 ${me ? 'bg-sun-100 font-bold' : ''}" style="--i:${i}"${me ? ' aria-current="true"' : ''}>
        <td class="px-3 py-3">${rank}</td>
        <td class="max-w-[9rem] truncate px-3 py-3">@${esc(p.username)}${me ? ` <span class="text-sm font-normal">${esc(t('lb.you'))}</span>` : ''}</td>
        <td class="whitespace-nowrap px-3 py-3"><span class="inline-flex items-center gap-1">${flame('h-4 w-4')}${effectiveStreak(p)}</span></td>
        <td class="whitespace-nowrap px-3 py-3 text-right"><span data-count="${p.xp}">${fmt(p.xp)}</span></td>
        <td class="whitespace-nowrap px-3 py-3"><span class="inline-flex items-center gap-2">${Plant.mini(idx, 'h-8 w-8')}<span class="hidden sm:inline">${esc(stageName(idx))}</span></span></td>
      </tr>`;
    };

    body.innerHTML = data.map((p, i) => row(p, i + 1, i)).join('');

    if (!data.some(p => p.id === state.uid) && state.profile) {
      const { count } = await sb.from('profiles').select('id', { count: 'exact', head: true })
        .gt('xp', state.profile.xp).not('username', 'is', null);
      foot.innerHTML = `<tr><td colspan="5" class="border-t border-moss-200 bg-moss-50 px-3 py-1 text-center text-sm text-ink/70">…</td></tr>` +
        row(state.profile, (count || 0) + 1, data.length);
    }

    $$('[data-count]', $('#route-leaderboard')).forEach(el => animateNumber(el, 0, Number(el.dataset.count), 1000));
  }
};

const ROUTES = [
  { id: 'home',        icon: 'home' },
  { id: 'quests',      icon: 'quests' },
  { id: 'leaderboard', icon: 'trophy' },
  { id: 'store',       icon: 'gift' }
];

const Router = {
  build() {
    $('#nav-desktop').innerHTML = ROUTES.map(r =>
      `<a href="#/${r.id}" data-route="${r.id}" class="flex min-h-[44px] items-center gap-2 rounded-lg px-3 font-bold hover:bg-moss-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-moss-700 aria-[current=page]:bg-moss-100 aria-[current=page]:text-moss-800">${icon(r.icon)}${esc(t('nav.' + r.id))}</a>`).join('');
    $('#nav-mobile').innerHTML = ROUTES.map(r =>
      `<a href="#/${r.id}" data-route="${r.id}" class="flex min-h-[56px] flex-col items-center justify-center gap-0.5 text-xs font-bold text-ink/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-moss-700 aria-[current=page]:bg-moss-100 aria-[current=page]:text-moss-800">${icon(r.icon)}${esc(t('nav.' + r.id))}</a>`).join('');
    this.mark();
  },

  mark() {
    $$('[data-route]').forEach(a => a.dataset.route === state.route ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  },

  current() {
    const id = (location.hash.match(/^#\/(\w+)/) || [])[1];
    return ROUTES.some(r => r.id === id) ? id : 'home';
  },

  async go(first = false) {
    if (!state.profile || !state.profile.username) return;
    const id = this.current();
    state.route = id;
    ROUTES.forEach(r => $('#route-' + r.id).classList.toggle('hidden', r.id !== id));
    this.mark();

    const section = $('#route-' + id);
    if (id === 'quests') Quests.render(true);
    Reveal.replay(section);
    if (id === 'home') { Quests.renderMeta(); Home.play(); Profile.loadRank(); }
    if (id === 'leaderboard') Leaderboard.load();
    if (id === 'quests') Vision.warm();

    if (!first) { window.scrollTo({ top: 0 }); const h = $('h1', section); if (h) h.focus({ preventScroll: true }); }

    if (id === 'quests' || id === 'home') {
      const before = [...state.done].sort().join();
      await Quests.loadDone();
      if ([...state.done].sort().join() !== before) { Quests.render(true); }
    }
  }
};

const App = {
  show(view) {
    $('#boot').classList.add('hidden');
    $('#auth-view').classList.toggle('hidden', view !== 'auth');
    $('#app-view').classList.toggle('hidden', view !== 'app');
  },

  async onSession(session) {
    const uid = session && session.user ? session.user.id : null;
    if (state.booted && uid === state.uid) return;
    state.booted = true; state.uid = uid;

    if (!uid) { state.profile = null; this.show('auth'); return; }

    const p = await Profile.load();
    if (!p) { state.booted = false; state.uid = null; this.show('auth'); return; }
    state.profile = p;
    if (!p.username) { this.show('app'); Profile.askUsername(); return; }
    await this.enter();
  },

  async enter() {
    if (!state.profile.username) state.profile = await Profile.load();
    await Quests.loadDone();
    Quests.render(true);
    Profile.apply(state.profile);
    this.show('app');
    if (!location.hash.startsWith('#/')) location.hash = '#/home';
    Router.go(true);
  },

  relang() {
    I18n.apply();
    Auth.setMode(Auth.mode);
    Router.build();
    Hero.refresh();
    Plant.buildLadders();
    if (state.profile && state.profile.username) {
      Profile.apply(state.profile);
      Quests.render(true);
      if (state.route === 'leaderboard') Leaderboard.load();
    }
  },

  bind() {
    $('#tab-login').addEventListener('click', () => Auth.setMode('login'));
    $('#tab-signup').addEventListener('click', () => Auth.setMode('signup'));
    $('#auth-form').addEventListener('submit', (e) => { e.preventDefault(); Auth.submit(); });
    $('#btn-google').addEventListener('click', () => Auth.google());
    $('#btn-logout').addEventListener('click', () => Auth.signOut());
    Auth.watchUsername($('#f-username'), $('#username-hint'));
    Auth.watchUsername($('#n-username'), $('#n-hint'));
    $('#name-form').addEventListener('submit', (e) => { e.preventDefault(); Profile.saveUsername(); });

    $$('[data-lang]').forEach(b => b.addEventListener('click', () => I18n.set(b.dataset.lang)));

    $('#quest-tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (b) Quests.setTab(b.dataset.tab);
    });

    document.addEventListener('click', (e) => {
      const a = e.target.closest('[data-go-tab]');
      if (a) state.tab = a.dataset.goTab;
    });

    $('#quest-list').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cam]');
      if (b) Camera.open(b.dataset.cam);
    });
    $('#cam-shutter').addEventListener('click', () => Camera.shoot());
    $('#cam-close').addEventListener('click', () => Camera.close());
    $('#cam-flip').addEventListener('click', () => Camera.flip());
    $('#cam-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      Camera.pickFile(file);
    });

    $('#scan-close').addEventListener('click', () => Scan.close());
    $('#scan-go').addEventListener('click', () => { Scan.close(); if (location.hash === '#/home') Router.go(); else location.hash = '#/home'; });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!$('#cam-modal').classList.contains('hidden')) Camera.close();
      else if (!$('#scan-close').classList.contains('hidden') && !$('#scan-modal').classList.contains('hidden')) Scan.close();
    });
    window.addEventListener('hashchange', () => Router.go());
    window.addEventListener('scroll', () => $('#app-header').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  },

  async init() {
    I18n.init();
    hydrateIcons();
    I18n.apply();
    Scene.build();
    Plant.buildLadders();
    Router.build();
    Reveal.init();
    this.bind();
    Auth.setMode('login');
    Hero.start();

    await loadConfig();
    configured =
      CONFIG.SUPABASE_URL.startsWith('https://') && !CONFIG.SUPABASE_URL.includes('YOUR_') &&
      CONFIG.SUPABASE_ANON_KEY.length > 20 && !CONFIG.SUPABASE_ANON_KEY.includes('YOUR_');

    if (!configured) {
      $('#boot').classList.add('hidden');
      const w = $('#config-warning'); w.classList.remove('hidden'); w.classList.add('grid');
      return;
    }

    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
    });

    sb.auth.onAuthStateChange((_event, session) => { setTimeout(() => this.onSession(session), 0); });
    const { data } = await sb.auth.getSession();
    await this.onSession(data.session);

    if (location.search.includes('code=')) history.replaceState({}, '', location.pathname + location.hash);
  }
};

App.init();
</script>
